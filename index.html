<style>
/* One fixed palette everywhere — warm cocoa ground + ivory text + the brand's
   own orange, matching the illustrated "bomb sprouting a plant" logo. Not
   adaptive to system light/dark; this is the app's committed visual identity. */
:root{
  --bg:#1e160f;
  --bg-elevated:#2b2117;
  --bg-card:#302418;
  --text:#f5efe3;
  --text-muted:#c9b79b;
  --border:rgba(245,239,227,0.14);
  --border-soft:rgba(245,239,227,0.08);
  --accent:#f05d2d;
  --accent-contrast:#241205;
  --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 30px rgba(0,0,0,0.5);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0; overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

@keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
@keyframes revealIn{ 0%{opacity:0; transform:translateY(14px) scale(.96);} 100%{opacity:1; transform:translateY(0) scale(1);} }
@keyframes glowPulse{ 0%,100%{opacity:.45; transform:scale(.92);} 50%{opacity:.9; transform:scale(1.04);} }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes sparkRise{ 0%{transform:translateY(0) scale(.6); opacity:0;} 15%{opacity:1;} 100%{transform:translateY(-72vh) scale(1); opacity:0;} }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

.spark-layer{ position:fixed; inset:0; overflow:hidden; z-index:9999; pointer-events:none; }
.spark{ position:absolute; bottom:-20px; border-radius:50%; filter:blur(1px); animation-name:sparkRise; animation-timing-function:cubic-bezier(.2,.7,.3,1); animation-fill-mode:forwards; }

.wrap{ max-width:820px; margin:0 auto; padding:24px 18px 90px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
.topbar-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.week-label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.08em; color:var(--text-muted); border:1px solid var(--border); padding:4px 9px; border-radius:100px; }

h1{ font-family:Georgia,'Iowan Old Style','Times New Roman',serif; font-style:italic; font-weight:700; font-size:clamp(24px,6vw,34px); line-height:1.15; margin:0 0 8px; text-wrap:balance; }
.eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); margin:0 0 6px; }
.subhead{ color:var(--text-muted); font-size:14px; line-height:1.55; margin:0 0 28px; max-width:520px; }
.screen{display:none;}
.screen.active{display:block; animation:fadein .35s cubic-bezier(.16,1,.3,1);}

.icon{ display:inline-flex; flex-shrink:0; }

/* ---- Logo (same size everywhere) ---- */
.logo{ height:133px; width:auto; display:block; }

/* ---- Burst accent — the logo's own bomb-sprouting-a-plant illustration,
   reused wherever the app wants a "moment": the pre-login gate and the
   winner reveal. Plain CSS conic-gradient, not hand-drawn artwork. */
.burst{ position:relative; overflow:hidden; }
.burst::before{
  content:''; position:absolute; top:-160px; right:-160px; width:460px; height:460px; border-radius:50%;
  background:repeating-conic-gradient(from 8deg, var(--accent) 0deg 2.2deg, transparent 2.2deg 15deg);
  opacity:.85;
  -webkit-mask-image:radial-gradient(circle, black 35%, transparent 72%);
  mask-image:radial-gradient(circle, black 35%, transparent 72%);
  pointer-events:none;
}
.burst > *{ position:relative; z-index:1; }

/* ---- Gate (pre-login: vote / sign-in / no-access) ---- */
.gate{
  background:var(--bg-card); color:var(--text);
  border-radius:20px;
  padding:44px clamp(24px,6vw,40px) 40px;
  margin:6vh 0 0;
  min-height:min(560px,70vh);
  display:flex; flex-direction:column;
  box-shadow:var(--shadow);
}
.gate-inner{ position:relative; z-index:1; display:flex; flex-direction:column; flex:1; max-width:420px; }
.gate-inner .logo{ align-self:flex-start; margin-bottom:clamp(36px,9vh,64px); }
.gate-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
.gate h1{ max-width:15ch; }
.gate-body{ font-size:14.5px; line-height:1.7; color:var(--text-muted); margin:0 0 30px; max-width:34ch; }
.gate-actions{ margin-top:auto; display:flex; flex-direction:column; gap:12px; }
.gate-btn{ width:100%; border-radius:0; font-weight:700; font-size:15px; padding:16px 20px; border:none; cursor:pointer; text-align:left; transition:transform .12s ease, filter .12s ease; font-family:'Inter',system-ui,sans-serif; }
.gate-btn:active{ transform:scale(.98); }
.gate-btn.primary{ background:var(--accent); color:var(--accent-contrast); clip-path:polygon(0 0,96% 0,100% 30%,100% 100%,4% 100%,0 70%); }
.gate-btn.primary:hover{ filter:brightness(1.08); }
.gate-btn.ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }
.gate-btn.ghost:hover{ border-color:var(--accent); color:var(--accent); }
.field{ margin-bottom:14px; text-align:left; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
.field input{
  width:100%; font-size:16px; padding:13px 14px; border-radius:12px;
  border:1px solid var(--border); background:var(--bg-elevated); color:var(--text);
  transition:border-color .15s ease;
}
.field input:focus{ outline:none; border-color:var(--accent); }
.pw-wrap{ position:relative; }
.pw-wrap input{ padding-right:46px; }
.pw-toggle{
  position:absolute; right:4px; top:0; bottom:0; width:42px;
  background:none; border:none; cursor:pointer; color:var(--text-muted);
  display:flex; align-items:center; justify-content:center;
}
.login-error{ color:var(--accent); font-size:13px; margin:-2px 0 14px; min-height:1px; text-align:left; }
.full-btn{ width:100%; padding:15px; font-size:15px; min-height:48px; }
.forgot-link{ display:block; text-align:left; margin-top:14px; font-size:13px; color:var(--text-muted); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; }

/* ---- Header identity row ---- */
.who-row{ display:flex; align-items:center; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
.who-row .whoname{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; }
.logout-link{ margin-left:auto; font-size:13px; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:8px 4px; text-decoration:underline; }
.badge{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:100px; font-family:'JetBrains Mono',monospace; letter-spacing:.03em; }
.badge.owner{ background:var(--accent); color:var(--accent-contrast); }
.badge.admin{ border:1px solid var(--accent); color:var(--accent); }
.wallet-chip{ display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; background:var(--bg-elevated); border:1px solid var(--border); padding:6px 12px; border-radius:100px; color:var(--text); }
.badge.finance{ border:1px solid var(--text-muted); color:var(--text-muted); }

.balance-card{ background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:20px; box-shadow:var(--shadow); }
.balance-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.balance-label{ font-size:13px; color:var(--text-muted); }
.balance-amount{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; }
.balance-status{ font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.cashout-form{ display:flex; gap:8px; }
.cashout-form input{
  flex:1; min-width:0; font-family:'JetBrains Mono',monospace; font-size:16px;
  padding:11px 12px; min-height:44px; border-radius:10px;
  border:1px solid var(--border); background:var(--bg-elevated); color:var(--text);
}
.cashout-form input:focus{ outline:none; border-color:var(--accent); }
.cashout-form .ghost-btn{ white-space:nowrap; }

/* ---- Voting ---- */
.vote-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-bottom:24px; }
.vote-card{ background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s ease, box-shadow .18s ease; }
.vote-card:hover{ transform:translateY(-3px); border-color:var(--accent); }
.vote-card.selected{ border-color:var(--accent); border-width:2px; padding:15px; }
.avatar{ width:40px;height:40px;border-radius:10px; background:var(--accent); color:var(--accent-contrast); display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; flex-shrink:0; }
.vote-card .name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; flex:1; min-width:0; overflow-wrap:anywhere; }
.vote-btn{
  border:1px solid var(--border); background:transparent; color:var(--text);
  font-family:'Inter',sans-serif; font-weight:600; font-size:13px; padding:11px 16px;
  min-height:44px; border-radius:100px; cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.vote-btn:active{ transform:scale(.96); }
.vote-btn.voted{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
.lock-note{ display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--text-muted); background:var(--bg-elevated); border:1px solid var(--border-soft); padding:12px 16px; border-radius:12px; margin-bottom:24px; line-height:1.5; }
.lock-note .icon{ margin-top:1px; color:var(--text-muted); }
.empty-state{ text-align:center; padding:44px 20px; color:var(--text-muted); border:1px dashed var(--border); border-radius:16px; }

/* ---- Buttons ---- */
.primary-btn{
  position:relative; overflow:hidden;
  background:var(--accent); color:var(--accent-contrast); border:none;
  padding:14px 22px; min-height:48px; border-radius:100px; font-weight:700;
  font-family:'Space Grotesk',sans-serif; font-size:15px; cursor:pointer; width:100%; margin-bottom:20px;
  transition:transform .12s ease, filter .12s ease;
}
.primary-btn:hover{ filter:brightness(1.06); }
.primary-btn:active{ transform:scale(.98); }
.ghost-btn{ background:transparent; border:1px solid var(--border); color:var(--text); padding:12px 20px; min-height:46px; border-radius:100px; font-weight:600; font-size:14px; cursor:pointer; transition:transform .12s ease, border-color .15s ease, color .15s ease; }
.ghost-btn:hover{ border-color:var(--accent); color:var(--accent); }
.ghost-btn:active{ transform:scale(.97); }

details.manage{ border:1px solid var(--border); border-radius:14px; margin-bottom:16px; background:var(--bg-elevated); overflow:hidden; }
details.manage summary{ cursor:pointer; padding:15px 18px; font-weight:600; font-size:14px; list-style:none; display:flex; align-items:center; justify-content:space-between; }
details.manage summary::-webkit-details-marker{display:none;}
details.manage summary:after{content:'+'; color:var(--text-muted); font-size:18px;}
details.manage[open] summary:after{content:'\2212';}
.manage-body{ padding:0 18px 18px; }

.admin-row{ display:flex; align-items:center; gap:8px; padding:12px 0; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.admin-row:last-child{ border-bottom:none; }
.admin-row .arow-top{ display:flex; align-items:center; gap:8px; flex:1; min-width:150px; }
.admin-row .arow-name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; overflow-wrap:anywhere; }
.admin-row .arow-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-left:auto; }
.balance-input{ width:76px; font-family:'JetBrains Mono',monospace; font-size:13px; padding:8px 8px; min-height:38px; border-radius:8px; border:1px solid var(--border); background:var(--bg-card); color:var(--text); }
.small-btn{ font-size:12px; padding:8px 12px; min-height:36px; border-radius:100px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; white-space:nowrap; transition:transform .12s ease, border-color .15s ease, color .15s ease; }
.small-btn:hover{ border-color:var(--accent); color:var(--accent); }
.small-btn:active{ transform:scale(.95); }
.small-btn.danger:hover{ border-color:#c0392b; color:#c0392b; }
.small-btn:disabled{ opacity:.5; cursor:default; }

.add-member-form{ display:flex; flex-direction:column; gap:10px; margin-top:16px; padding-top:16px; border-top:1px solid var(--border-soft); }
.add-member-form .row2{ display:flex; gap:8px; }
.add-member-form input, .add-member-form select{ font-size:16px; padding:11px 12px; min-height:44px; border-radius:10px; border:1px solid var(--border); background:var(--bg-card); color:var(--text); flex:1; min-width:0; }
.gen-btn{ background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:0 12px; cursor:pointer; font-size:13px; white-space:nowrap; }
.form-hint{ font-size:12px; color:var(--text-muted); margin-top:-2px; }

/* ---- Tallying / reveal ---- */
.tallying{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:100px 20px; gap:18px; }
.spinner{ width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
.tallying p{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; color:var(--text-muted); text-transform:uppercase; margin:0; }

.winner-card{ background:var(--bg-card); border:1px solid var(--border); border-radius:20px; padding:34px 22px; text-align:center; margin-bottom:26px; box-shadow:var(--shadow); animation:revealIn .5s cubic-bezier(.16,1,.3,1); }
.trophy-wrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; width:76px; height:76px; margin-bottom:14px; }
.trophy-wrap::before{ content:''; position:absolute; inset:-8px; border-radius:50%; background:radial-gradient(circle, rgba(240,93,45,.35), transparent 70%); animation:glowPulse 2.6s ease-in-out infinite; }
.trophy-wrap .icon{ position:relative; color:var(--accent); }
.winner-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(22px,6vw,32px); margin:0 0 6px; overflow-wrap:anywhere; }
.winner-sub{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; color:var(--text-muted); text-transform:uppercase; }
.winner-bonus{ display:inline-flex; align-items:center; gap:6px; margin-top:14px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; color:var(--accent); }
.tie-list{ margin-bottom:22px; }
.tie-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.tie-row:last-child{ border-bottom:none; }

.scoreboard{ margin-bottom:26px; }
.score-row{ margin-bottom:14px; }
.score-top{ display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px; gap:8px; }
.score-top .sname{ font-weight:600; font-family:'Space Grotesk',sans-serif; overflow-wrap:anywhere; }
.score-top .scount{ font-family:'JetBrains Mono',monospace; color:var(--text-muted); font-size:12px; white-space:nowrap; }
.score-track{ height:8px; background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:100px; overflow:hidden; }
.score-fill{ height:100%; background:var(--accent); width:0%; border-radius:100px; transition:width 1s cubic-bezier(.16,1,.3,1); }

.setup-screen{ max-width:520px; margin:50px auto; text-align:center; padding:0 20px; }
.setup-screen h1{font-size:21px;}
.setup-screen code{ background:var(--bg-elevated); border:1px solid var(--border); padding:2px 6px; border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:13px; }

.loading{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; min-height:60vh; }
.loading-text{ color:var(--text-muted); font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; text-transform:uppercase; }
</style>

<div class="spark-layer" id="spark-layer" aria-hidden="true"></div>

<div class="wrap" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
/* =====================================================================
   BLACFOX — STAR WORKER OF THE WEEK
   -----------------------------------------------------------------
   ONE-TIME SETUP (~10 minutes):
   1. console.firebase.google.com → create a free project.
   2. Build → Firestore Database → Create database (any region).
   3. Build → Authentication → Sign-in method → enable "Email/Password".
      (If "Anonymous" is enabled from an earlier version of this app, turn
      it off here too — voting now always requires a real account.)
   4. Project settings (gear icon) → General → "Your apps" → web icon </>
      → register app → copy the firebaseConfig object shown.
   5. Paste it into FIREBASE_CONFIG below, replacing the placeholders.
   6. Firestore → Rules → paste the contents of firestore.rules (the file
      sitting right next to this one) → Publish. If the app ever gets stuck
      on the loading spinner after logging in, this step is the first thing
      to check — it means the rules were never published (or expired).
   7. BOOTSTRAP YOUR OWN OWNER ACCOUNT (one-time, done manually since nobody
      is admin yet for the app to do it automatically):
        a) Authentication → Users tab → "Add user" → enter your email + a
           password → copy the UID it shows you in the table.
        b) Firestore → Data tab → Start collection → Collection ID: sotw_profiles
           → Document ID: paste that UID → add fields:
             name (string)   = your name
             role (string)   = owner
             balance (number) = 0
           → Save.
   8. Open the app and log in with that email/password. You're now the
      owner — add the rest of the team from inside the app from here on.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDB0AG47o_7WisTKkxCOuc-84z-3Z8yXK8",
  authDomain: "star-player-of-the-week.firebaseapp.com",
  projectId: "star-player-of-the-week",
  storageBucket: "star-player-of-the-week.firebasestorage.app",
  messagingSenderId: "443331243429",
  appId: "1:443331243429:web:0b712ec3eb144c4fb20c4c"

function initApp(){
  const NEEDS_SETUP = FIREBASE_CONFIG.apiKey === "PASTE_YOUR_API_KEY_HERE";
  const appEl = document.getElementById('app');
  if (!appEl) { console.warn('Blacfox SOTW: #app container not found in the page yet.'); return; }

  if (NEEDS_SETUP) {
    appEl.innerHTML = `
      <div class="setup-screen">

        <h1>One setup step left</h1>
        <p style="color:var(--text-muted);font-size:14px;line-height:1.6;">
          This app needs a free Firebase project for logins and shared data.
          Find <code>FIREBASE_CONFIG</code> near the top of this file's script,
          and follow the numbered steps in the comment right above it.
        </p>
      </div>`;
    return;
  }

  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const profilesCol = db.collection('sotw_profiles');
  const myvoteCol = db.collection('sotw_myvote'); // each real logged-in account's own vote — nobody else can ever read these
  const tallyCol = db.collection('sotw_tally');   // anonymous running counts — admin-only, and only once revealed
  const payoutCol = db.collection('sotw_payout_requests'); // cash-out requests
  const settingsRef = db.collection('sotw_meta').doc('settings');

  const state = {
    user: null,
    profiles: {},      // uid -> {name,email,role,balance}
    settings: { revealed:false, bonusAwardedUids:[], winnerUids:[], totalVotes:0, financeUid:null, votingOpen:false },
    myVote: null,      // my own votedForUid, or null
    tally: {},         // uid -> count — only ever populated for admins, only after reveal
    payoutQueue: [],       // all requests — only populated for finance/admin
    myPayout: null,        // my own latest request (any status), everyone tracks their own
    unsubs: [],
    tallyUnsub: null,
    payoutQueueUnsub: null,
    myPayoutUnsub: null,
    loadedProfiles:false, loadedSettings:false, loadedMyVote:false, loadedTally:false,
    loadErrorMsg: null
  };
  let uiRevealing = false;
  let lastRevealedState = false;
  let gateShowLogin = false; // toggles the logged-out landing screen between the "Vote Now" hero and the sign-in form

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }
  function initials(name){
    return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  }
  function getWeekLabel(){
    const now = new Date();
    const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
    const dayNum = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
    const week = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + (firstThursday.getUTCDay()+6)%7) / 7);
    return `WEEK ${week} · ${d.getUTCFullYear()}`;
  }
  function generatePassword(){
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
    let out=''; for(let i=0;i<8;i++) out+=chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function isAdmin(profile){
    return !!profile && (profile.role === 'owner' || profile.role === 'admin');
  }
  function isFinanceUid(uid){
    return !!uid && state.settings.financeUid === uid;
  }
  function canManagePayouts(profile, uid){
    return isAdmin(profile) || isFinanceUid(uid);
  }
  function handleErr(err){
    console.warn('Firestore error:', err && err.message);
    if (err && err.code === 'permission-denied'){
      state.loadErrorMsg = 'Permission denied loading data. This almost always means the Firestore Security Rules in your Firebase console are missing or still the default — publish the rules for this app and reload.';
      render();
    }
  }

  function launchSparks(){
    const layer = document.getElementById('spark-layer');
    if (!layer) return;
    const colors = ['var(--accent)', 'rgba(240,93,45,.55)', 'var(--text-muted)'];
    for (let i=0;i<16;i++){
      const el = document.createElement('div');
      el.className = 'spark';
      const size = 5 + Math.random()*7;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = (10 + Math.random()*80) + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      const duration = 1.8 + Math.random()*1.4;
      const delay = Math.random()*0.5;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = delay + 's';
      layer.appendChild(el);
      setTimeout(()=>{ if (el.parentNode) el.parentNode.removeChild(el); }, (duration+delay)*1000 + 300);
    }
  }

  // ---------------- Auth wiring ----------------
  function clearSubs(){ state.unsubs.forEach(u=>{ try{u();}catch(e){} }); state.unsubs=[]; }
  function clearTallySub(){
    if (state.tallyUnsub){ try{ state.tallyUnsub(); }catch(e){} state.tallyUnsub=null; }
    state.tally = {}; state.loadedTally = false;
  }
  function clearPayoutSubs(){
    if (state.payoutQueueUnsub){ try{ state.payoutQueueUnsub(); }catch(e){} state.payoutQueueUnsub=null; }
    if (state.myPayoutUnsub){ try{ state.myPayoutUnsub(); }catch(e){} state.myPayoutUnsub=null; }
    state.payoutQueue = []; state.myPayout = null;
  }
  // Only admins ever subscribe to the tally, and only once revealed — everyone else
  // just reads settings.winnerUids / settings.totalVotes, which never expose per-person data.
  function maybeManageTally(){
    if (!state.loadedProfiles || !state.loadedSettings) return;
    const me = state.profiles[state.user.uid];
    const shouldSubscribe = state.settings.revealed && isAdmin(me);
    if (shouldSubscribe && !state.tallyUnsub){
      state.loadedTally = false;
      state.tallyUnsub = tallyCol.onSnapshot(snap=>{
        const t={}; snap.forEach(d=>t[d.id]=d.data().count||0);
        state.tally = t; state.loadedTally = true; render();
      }, handleErr);
    } else if (!shouldSubscribe && state.tallyUnsub){
      clearTallySub();
    }
  }

  // Only the assigned finance person (or an admin) ever sees the full payout queue.
  // Everyone tracks just their own latest request separately.
  function maybeManagePayouts(){
    if (!state.loadedProfiles || !state.loadedSettings) return;
    const me = state.profiles[state.user.uid];
    const canManage = canManagePayouts(me, state.user.uid);
    if (canManage && !state.payoutQueueUnsub){
      state.payoutQueueUnsub = payoutCol.onSnapshot(snap=>{
        const list = [];
        snap.forEach(d => list.push(Object.assign({ id:d.id }, d.data())));
        list.sort((a,b) => (a.status==='pending'?0:1) - (b.status==='pending'?0:1));
        state.payoutQueue = list; render();
      }, handleErr);
    } else if (!canManage && state.payoutQueueUnsub){
      state.payoutQueueUnsub(); state.payoutQueueUnsub = null; state.payoutQueue = [];
    }
    if (!state.myPayoutUnsub){
      state.myPayoutUnsub = payoutCol.where('uid','==', state.user.uid).onSnapshot(snap=>{
        let pending = null;
        snap.forEach(d => {
          const r = Object.assign({ id:d.id }, d.data());
          if (r.status === 'pending') pending = r;
        });
        state.myPayout = pending;
        render();
      }, handleErr);
    }
  }

  auth.onAuthStateChanged(user => {
    state.user = user;
    clearSubs();
    clearTallySub();
    clearPayoutSubs();
    if (user){
      state.loadedProfiles=false; state.loadedSettings=false; state.loadedMyVote=false;
      state.loadErrorMsg = null;
      render();
      const u1 = profilesCol.onSnapshot(snap=>{
        const p={}; snap.forEach(d=>p[d.id]=d.data()); state.profiles=p; state.loadedProfiles=true;
        state.loadErrorMsg = null;
        maybeManageTally(); maybeManagePayouts(); render();
      }, handleErr);
      const u2 = settingsRef.onSnapshot(snap=>{
        state.settings = snap.data() || { revealed:false, bonusAwardedUids:[], winnerUids:[], totalVotes:0, financeUid:null, votingOpen:false };
        state.loadedSettings=true;
        maybeManageTally(); maybeManagePayouts(); render();
      }, handleErr);
      const u3 = myvoteCol.doc(user.uid).onSnapshot(snap=>{
        state.myVote = snap.exists ? snap.data().votedForUid : null;
        state.loadedMyVote=true; render();
      }, handleErr);
      state.unsubs=[u1,u2,u3];
    } else {
      render();
    }
  });

  function login(email,password){ return auth.signInWithEmailAndPassword(email,password); }
  function logout(){ auth.signOut(); }
  function forgotPassword(email){
    if(!email){ alert('Enter your email above first, then click "Forgot password?" again.'); return; }
    auth.sendPasswordResetEmail(email)
      .then(()=>alert('Check your email for a password reset link.'))
      .catch(err=>{
        const map = {
          'auth/invalid-email':'That email address looks invalid.',
          'auth/user-not-found':'Check your email for a password reset link.' // don't reveal whether the account exists
        };
        alert(map[err.code] || err.message);
      });
  }

  // ---------------- Admin actions ----------------
  function createTeamMember(name, email, password, role){
    const secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, 'Secondary_' + Date.now());
    return secondaryApp.auth().createUserWithEmailAndPassword(email, password)
      .then(cred => {
        const uid = cred.user.uid;
        return secondaryApp.auth().signOut().then(()=>uid);
      })
      .then(uid => profilesCol.doc(uid).set({ name:name, email:email, role:role, balance:0 }))
      .finally(()=> secondaryApp.delete().catch(()=>{}));
  }
  function removeTeammate(uid){
    // Note: if they'd already voted this week, that vote's count stays in the anonymous
    // tally — it can't be reversed without knowing who they picked, which nobody is allowed to see.
    profilesCol.doc(uid).delete()
      .then(()=> myvoteCol.doc(uid).delete().catch(()=>{}))
      .catch(err=>alert('Could not remove: ' + err.message));
  }
  function setRole(uid, newRole){
    profilesCol.doc(uid).update({ role:newRole }).catch(err=>alert(err.message));
  }
  function setFinanceHolder(uid){
    const next = state.settings.financeUid === uid ? null : uid;
    settingsRef.set({ financeUid: next }, { merge:true }).catch(err=>alert(err.message));
  }
  function updateBalance(uid, value){
    const n = Number(value);
    if (isNaN(n)) return;
    profilesCol.doc(uid).update({ balance:n }).catch(err=>alert(err.message));
  }

  // ---------------- Payouts ----------------
  function requestCashout(amount){
    const me = state.profiles[state.user.uid];
    const amt = Math.floor(Number(amount));
    if (!me || state.myPayout || !(amt > 0) || amt > (me.balance||0)) return;
    payoutCol.add({
      uid: state.user.uid,
      name: me.name,
      amount: amt,
      status: 'pending',
      requestedAt: firebase.firestore.FieldValue.serverTimestamp(),
      resolvedAt: null,
      resolvedBy: null
    }).catch(err=>alert(err.message));
  }
  function cancelCashout(reqId){
    payoutCol.doc(reqId).update({ status:'cancelled', resolvedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(err=>alert(err.message));
  }
  function approvePayout(reqId){
    const reqRef = payoutCol.doc(reqId);
    db.runTransaction(tx => tx.get(reqRef).then(reqSnap => {
      if (!reqSnap.exists) return;
      const req = reqSnap.data();
      if (req.status !== 'pending') return;
      const profRef = profilesCol.doc(req.uid);
      return tx.get(profRef).then(profSnap => {
        const bal = (profSnap.data() && profSnap.data().balance) || 0;
        if (bal < req.amount){
          throw new Error(`${req.name}'s balance is now only B$${bal} — lower than this B$${req.amount} request. Reject it or adjust their balance first.`);
        }
        tx.update(profRef, { balance: bal - req.amount });
        tx.update(reqRef, {
          status:'paid',
          resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
          resolvedBy: state.user.uid
        });
      });
    })).catch(err=>alert(err.message));
  }
  function rejectPayout(reqId){
    payoutCol.doc(reqId).update({
      status:'rejected',
      resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
      resolvedBy: state.user.uid
    }).catch(err=>alert(err.message));
  }

  // ---------------- Voting ----------------
  // Casting a vote never reads anyone's vote — old and new tally docs are nudged with an
  // atomic increment/decrement, so the only read in this transaction is your own vote record.
  function castVote(forUid){
    if (!state.settings.votingOpen || forUid === state.user.uid) return;
    const myVoteRef = myvoteCol.doc(state.user.uid);
    db.runTransaction(tx => {
      return tx.get(myVoteRef).then(myVoteSnap => {
        const prev = myVoteSnap.exists ? myVoteSnap.data().votedForUid : null;
        if (prev === forUid) return; // no change
        tx.set(tallyCol.doc(forUid), { count: firebase.firestore.FieldValue.increment(1) }, { merge:true });
        if (prev){
          tx.set(tallyCol.doc(prev), { count: firebase.firestore.FieldValue.increment(-1) }, { merge:true });
        }
        tx.set(myVoteRef, { votedForUid: forUid, ts: firebase.firestore.FieldValue.serverTimestamp() });
      });
    }).catch(err=>alert(err.message));
  }

  // Reveal happens in two steps: (1) atomically flip revealed so only one admin's click
  // proceeds even if two click at once, then (2) read the now-unlocked tally, work out the
  // winner, and store just their name in settings (never the per-person breakdown) so
  // regular members only ever learn who won, never the numbers.
  function doReveal(){
    db.runTransaction(tx => tx.get(settingsRef).then(sSnap => {
      const s = sSnap.data() || {};
      if (s.revealed) return false;
      tx.set(settingsRef, { revealed:true }, { merge:true });
      return true;
    })).then(didReveal => {
      if (!didReveal) return;
      return tallyCol.get().then(tallySnap => {
        const tally = {};
        tallySnap.forEach(d => tally[d.id] = d.data().count || 0);
        Object.keys(state.profiles).forEach(uid => { if (!(uid in tally)) tally[uid] = 0; });
        const entries = Object.entries(tally);
        const total = entries.reduce((a,[,c])=>a+c,0);
        const top = total > 0 ? Math.max(...entries.map(([,c])=>c)) : 0;
        const winnerUids = total > 0 ? entries.filter(([,c])=>c===top).map(([uid])=>uid) : [];
        return settingsRef.set({ winnerUids, totalVotes: total }, { merge:true }).then(() => {
          if (winnerUids.length === 1){
            const wUid = winnerUids[0];
            const wRef = profilesCol.doc(wUid);
            return db.runTransaction(tx => tx.get(wRef).then(pSnap => {
              const cur = (pSnap.data() && pSnap.data().balance) || 0;
              tx.update(wRef, { balance: cur + BONUS_AMOUNT });
              const payoutRef = db.collection('sotw_payouts').doc();
              tx.set(payoutRef, {
                uid: wUid,
                name: (pSnap.data() && pSnap.data().name) || '',
                amount: BONUS_AMOUNT,
                week: getWeekLabel(),
                ts: firebase.firestore.FieldValue.serverTimestamp()
              });
            }));
          }
        });
      });
    }).catch(err=>alert('Could not reveal: ' + err.message));
  }

  function onRevealClick(){
    if (state.settings.votingOpen) return; // end the session before revealing
    uiRevealing = true;
    render();
    setTimeout(()=>{ uiRevealing = false; doReveal(); }, 1100);
  }

  function awardBonus(uid){
    const already = (state.settings.bonusAwardedUids||[]).includes(uid);
    if (already) return;
    const profile = state.profiles[uid];
    if (!profile) return;
    const batch = db.batch();
    batch.update(profilesCol.doc(uid), { balance: (profile.balance||0) + BONUS_AMOUNT });
    const payoutRef = db.collection('sotw_payouts').doc();
    batch.set(payoutRef, { uid, name:profile.name, amount:BONUS_AMOUNT, week:getWeekLabel(), ts:firebase.firestore.FieldValue.serverTimestamp() });
    batch.set(settingsRef, { bonusAwardedUids: firebase.firestore.FieldValue.arrayUnion(uid) }, { merge:true });
    batch.commit().catch(err=>alert('Could not award bonus: ' + err.message));
  }

  function startNewWeek(){
    const batch = db.batch();
    Object.keys(state.profiles).forEach(uid => { batch.delete(myvoteCol.doc(uid)); });
    tallyCol.get().then(tallySnap => {
      tallySnap.forEach(doc => batch.delete(doc.ref));
      return batch.commit();
    }).then(()=>{
      settingsRef.set({ revealed:false, bonusAwardedUids:[], winnerUids:[], totalVotes:0, votingOpen:false }, { merge:true });
    }).catch(err=>alert('Could not start new week: ' + err.message));
  }

  // Only an admin/owner may open or close the voting window. While closed, nobody —
  // including admins — can cast a vote; enforced both here and in firestore.rules.
  function startVoting(){
    settingsRef.set({ votingOpen:true }, { merge:true }).catch(err=>alert(err.message));
  }
  function endVoting(){
    settingsRef.set({ votingOpen:false }, { merge:true }).catch(err=>alert(err.message));
  }

  // ---------------- Render ----------------
  function render(){
    if (!state.user){ renderGate(); return; }
    if (!state.loadedProfiles || !state.loadedSettings || !state.loadedMyVote){
      appEl.innerHTML = `<div class="loading"><div class="spinner"></div><div class="loading-text">Loading</div>${state.loadErrorMsg ? `<p style="color:var(--accent);font-size:13px;max-width:320px;text-align:center;line-height:1.5;">${esc(state.loadErrorMsg)}</p>` : ''}</div>`;
      return;
    }
    if (uiRevealing){ renderTallying(); return; }

    const me = state.profiles[state.user.uid];
    if (!me){ renderNoAccess(); return; }

    const nowRevealed = !!state.settings.revealed;
    const admin = isAdmin(me);

    if (nowRevealed && admin && !state.loadedTally){
      appEl.innerHTML = `<div class="loading"><div class="spinner"></div><div class="loading-text">Loading</div></div>`;
      return;
    }
    if (nowRevealed && !lastRevealedState){
      setTimeout(launchSparks, 50);
    }
    lastRevealedState = nowRevealed;

    if (nowRevealed){ renderReveal(me); } else { renderMain(me); }
  }

  function renderTallying(){
    appEl.innerHTML = `
      <div class="tallying">
        <div class="spinner"></div>
        <p>Tallying the votes</p>
      </div>`;
  }

  function renderGate(){
    if (gateShowLogin){ renderLogin(); return; }
    appEl.innerHTML = `
      <div class="gate burst">
        <div class="gate-inner">
          ${brandLogo()}
          <p class="gate-eyebrow">${getWeekLabel()}</p>
          <h1>Star Worker of the Week</h1>
          <p class="gate-body">Vote for the teammate who went above and beyond this week. The winner takes home B$${BONUS_AMOUNT} in Blacfox Dollars.</p>
          <div class="gate-actions">
            <button class="gate-btn primary" id="gate-vote-btn">Vote Now</button>
          </div>
        </div>
      </div>`;
    document.getElementById('gate-vote-btn').addEventListener('click', () => {
      gateShowLogin = true; render();
    });
  }

  function renderLogin(){
    appEl.innerHTML = `
      <div class="gate burst">
        <div class="gate-inner">
          ${brandLogo()}
          <h1>Sign in</h1>
          <p class="gate-body" style="margin-bottom:24px;">Enter your email and password to vote.</p>
          <div class="login-error" id="login-error"></div>
          <form id="login-form">
            <div class="field">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" autocomplete="username" inputmode="email" autocapitalize="none" required>
            </div>
            <div class="field">
              <label for="login-pw">Password</label>
              <div class="pw-wrap">
                <input type="password" id="login-pw" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="gate-btn primary">Log in</button>
          </form>
          <button class="forgot-link" id="forgot-btn">Forgot password?</button>
          <button class="forgot-link" id="gate-back-btn">‹ Back</button>
        </div>
      </div>`;

    document.getElementById('pw-toggle').addEventListener('click', () => {
      const pw = document.getElementById('login-pw');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });
    document.getElementById('forgot-btn').addEventListener('click', () => {
      forgotPassword(document.getElementById('login-email').value.trim());
    });
    document.getElementById('gate-back-btn').addEventListener('click', () => {
      gateShowLogin = false; render();
    });
    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();

      errEl.textContent = '';
      if (!email || !pw){ errEl.textContent = 'Enter both your email and password.'; return; }
      login(email, pw).catch(err => {
        const map = {
          'auth/wrong-password':'Incorrect email or password.',
          'auth/user-not-found':'Incorrect email or password.',
          'auth/invalid-credential':'Incorrect email or password.',
          'auth/invalid-email':'That email address looks invalid.',
          'auth/user-disabled':'This account has been disabled. Ask an admin.',
          'auth/too-many-requests':'Too many attempts — wait a bit and try again.'
        };
        errEl.textContent = map[err.code] || err.message;
      });
    });
  }

  function renderNoAccess(){
    appEl.innerHTML = `
      <div class="gate burst">
        <div class="gate-inner">
          ${brandLogo()}
          <h1>No access yet</h1>
          <p class="gate-body">Your account isn't linked to a profile in this app. Ask an admin to add you, or confirm you're using the right email.</p>
          <div class="gate-actions">
            <button class="gate-btn ghost" id="logout-btn2">Log out</button>
          </div>
        </div>
      </div>`;
    document.getElementById('logout-btn2').addEventListener('click', logout);
  }

  function header(me){
    return `
      <div class="topbar">
        <div class="brand">${brandLogo()}</div>
        <div class="topbar-right">
          <span class="week-label">${getWeekLabel()}</span>

        </div>
      </div>

        ${me.role==='owner' ? '<span class="badge owner">Owner</span>' : ''}
        ${me.role==='admin' ? '<span class="badge admin">Admin</span>' : ''}
        <button class="logout-link" id="logout-btn">Log out</button>
      </div>`;
  }

  function manageTeamHTML(){
    const rows = Object.entries(state.profiles)
      .sort((a,b)=>a[1].name.localeCompare(b[1].name))
      .map(([uid,p]) => {

          </div>

            <div class="row2"><input type="email" id="new-email" placeholder="Email address" autocapitalize="none"></div>

            </div>
            <p class="form-hint">Share the temporary password with them directly. They can reset it anytime from the login screen.</p>
          </div>
        </div>
      </details>`;
  }

  function payoutQueueHTML(){
    const pending = state.payoutQueue.filter(r => r.status === 'pending');
    const history = state.payoutQueue.filter(r => r.status !== 'pending').slice(0, 8);

    const rowHTML = (r, withActions) => `
      <div class="admin-row">
        <div class="arow-top">
          <span class="arow-name">${esc(r.name)}</span>
          <span class="badge ${r.status==='paid'?'owner':''}" style="${r.status!=='paid' && r.status!=='pending' ? 'border:1px solid var(--border);color:var(--text-muted);' : ''}">${esc(r.status)}</span>
        </div>
        <div class="arow-actions">
          <span style="font-family:'JetBrains Mono',monospace;font-size:13px;">B$${r.amount}</span>
          ${withActions ? `
            <button class="small-btn" data-approve="${r.id}">Approve</button>
            <button class="small-btn danger" data-reject="${r.id}">Reject</button>
          ` : ''}
        </div>
      </div>`;

    return `
      <details class="manage">
        <summary>Payout requests${pending.length ? ` (${pending.length})` : ''}</summary>
        <div class="manage-body">
          ${pending.length ? pending.map(r=>rowHTML(r,true)).join('') : '<p style="color:var(--text-muted);font-size:13px;">Nothing awaiting approval.</p>'}
          ${history.length ? `<p class="form-hint" style="margin-top:14px;">Recent history</p>${history.map(r=>rowHTML(r,false)).join('')}` : ''}
        </div>
      </details>`;
  }

  function bindPayoutQueue(){
    appEl.querySelectorAll('[data-approve]').forEach(btn => btn.addEventListener('click', () => approvePayout(btn.dataset.approve)));
    appEl.querySelectorAll('[data-reject]').forEach(btn => {
      btn.addEventListener('click', () => { if (confirm('Reject this payout request?')) rejectPayout(btn.dataset.reject); });
    });
  }

  function bindManageTeam(){
    appEl.querySelectorAll('[data-balance]').forEach(inp => {
      inp.addEventListener('change', () => updateBalance(inp.dataset.balance, inp.value));
    });
    appEl.querySelectorAll('[data-role-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const next = btn.dataset.currentRole === 'admin' ? 'member' : 'admin';
        setRole(btn.dataset.roleToggle, next);
      });
    });
    appEl.querySelectorAll('[data-finance-toggle]').forEach(btn => {
      btn.addEventListener('click', () => setFinanceHolder(btn.dataset.financeToggle));
    });
    appEl.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = state.profiles[btn.dataset.remove];
        if (confirm(`Remove ${p ? p.name : 'this person'} from the team? They'll lose access immediately.`)) {
          removeTeammate(btn.dataset.remove);
        }
      });
    });
    const genBtn = document.getElementById('gen-pw-btn');
    if (genBtn) genBtn.addEventListener('click', () => { document.getElementById('new-pw').value = generatePassword(); });
    const addBtn = document.getElementById('add-member-btn');
    if (addBtn) addBtn.addEventListener('click', () => {
      const name = document.getElementById('new-name').value.trim();
      const email = document.getElementById('new-email').value.trim();
      const pw = document.getElementById('new-pw').value;
      const role = document.getElementById('new-role').value;
      if (!name || !email || !pw){ alert('Fill in name, email and a temporary password first.'); return; }
      if (pw.length < 6){ alert('Password needs to be at least 6 characters.'); return; }
      addBtn.disabled = true; addBtn.textContent = 'Adding…';
      createTeamMember(name, email, pw, role)
        .then(() => {
          document.getElementById('new-name').value='';
          document.getElementById('new-email').value='';
          document.getElementById('new-pw').value='';
        })
        .catch(err => alert('Could not add teammate: ' + err.message))
        .finally(() => { addBtn.disabled=false; addBtn.textContent='Add'; });
    });
  }

  function renderMain(me){
    const votingOpen = !!state.settings.votingOpen;
    const others = Object.entries(state.profiles).filter(([uid]) => uid !== state.user.uid);
    const myVote = state.myVote;
    const admin = isAdmin(me);
    const financeAccess = canManagePayouts(me, state.user.uid);
    const financeName = state.settings.financeUid ? (state.profiles[state.settings.financeUid] || {}).name : null;

    let cashoutHTML;
    if (state.myPayout){
      cashoutHTML = `
        <div class="balance-card">
          <div class="balance-card-top"><span class="balance-label">Your balance</span><span class="balance-amount">B$${(me.balance||0).toLocaleString()}</span></div>
          <div class="balance-status">Cash-out of B$${state.myPayout.amount} requested — awaiting review</div>
          <button class="small-btn" id="cancel-cashout-btn">Cancel request</button>
        </div>`;
    } else if (me.balance > 0){
      cashoutHTML = `
        <div class="balance-card">
          <div class="balance-card-top"><span class="balance-label">Your balance</span><span class="balance-amount">B$${(me.balance||0).toLocaleString()}</span></div>
          <div class="cashout-form">
            <input type="number" id="cashout-amount" min="1" max="${me.balance}" step="1" placeholder="Amount" inputmode="numeric">
            <button class="ghost-btn" id="cashout-btn">Cash Out</button>
          </div>
        </div>`;
    } else {
      cashoutHTML = '';
    }

    let votingSectionHTML;
    if (!votingOpen){
      votingSectionHTML = `<div class="empty-state">Voting hasn't opened yet this week.${admin ? ' Click "Start Voting" below when you\'re ready.' : ' Check back once an admin opens it.'}</div>`;
    } else if (others.length === 0){
      votingSectionHTML = `<div class="empty-state">Add more teammates below before voting can start.</div>`;
    } else {
      votingSectionHTML = `
        <div class="vote-grid">
          ${others.map(([uid,p]) => `
            <div class="vote-card ${myVote===uid ? 'selected' : ''}">
              <div class="avatar">${initials(p.name)}</div>
              <div class="name">${esc(p.name)}</div>
              <button class="vote-btn ${myVote===uid ? 'voted' : ''}" data-vote="${uid}">${myVote===uid ? ICON_CHECK + ' Voted' : 'Vote'}</button>
            </div>
          `).join('')}
        </div>
        <div class="lock-note">${ICON_LOCK}<span>${myVote ? "Your vote is locked in." : "You haven't voted yet."} Only admins can reveal the results, and only once they choose to.</span></div>
      `;
    }

    // Only an admin can open/close the voting window or trigger a reveal — and reveal is
    // only offered once voting is closed, so results can't be tallied while votes are
    // still trickling in.
    const sessionHTML = !admin ? '' : (votingOpen
      ? `<button class="primary-btn" id="end-voting-btn">End Voting</button>`
      : `<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
           <button class="ghost-btn full-btn" id="start-voting-btn">Start Voting</button>
           <button class="primary-btn" id="reveal-btn" style="margin-bottom:0;">Reveal Results</button>
         </div>`);

    appEl.innerHTML = header(me) + `
      <h1>Star Worker of the Week</h1>
      <p class="subhead">Vote for the teammate who went above and beyond this week. The winner receives B$${BONUS_AMOUNT}. Results stay hidden until an admin reveals them.</p>

      ${cashoutHTML}

      ${votingSectionHTML}

      ${sessionHTML}
      ${financeAccess ? payoutQueueHTML() : ''}
      ${admin ? manageTeamHTML() : ''}
    `;

    document.getElementById('logout-btn').addEventListener('click', logout);
    appEl.querySelectorAll('[data-vote]').forEach(btn => btn.addEventListener('click', () => castVote(btn.dataset.vote)));
    const startBtn = document.getElementById('start-voting-btn');
    if (startBtn) startBtn.addEventListener('click', startVoting);
    const endBtn = document.getElementById('end-voting-btn');
    if (endBtn) endBtn.addEventListener('click', () => {
      if (confirm("End voting now? Nobody will be able to vote again until you start a new session.")) endVoting();
    });
    const revealBtn = document.getElementById('reveal-btn');
    if (revealBtn) revealBtn.addEventListener('click', onRevealClick);
    const cashoutBtn = document.getElementById('cashout-btn');
    if (cashoutBtn) cashoutBtn.addEventListener('click', () => {
      const amountInput = document.getElementById('cashout-amount');
      const amount = Math.floor(Number(amountInput.value));
      if (!amount || amount <= 0){ alert('Enter an amount to cash out.'); return; }
      if (amount > (me.balance||0)){ alert(`You only have B$${me.balance||0} available.`); return; }
      if (confirm(`Request a cash-out of B$${amount}?${financeName ? ' ' + financeName + ' will review it.' : ''}`)) requestCashout(amount);
    });
    const cancelBtn = document.getElementById('cancel-cashout-btn');
    if (cancelBtn) cancelBtn.addEventListener('click', () => { if (state.myPayout) cancelCashout(state.myPayout.id); });
    if (financeAccess) bindPayoutQueue();
    if (admin) bindManageTeam();
  }

  function renderReveal(me){
    const admin = isAdmin(me);
    const financeAccess = canManagePayouts(me, state.user.uid);
    const total = state.settings.totalVotes || 0;
    const winnerUids = state.settings.winnerUids || [];

    let winnerBlock;
    if (total === 0){
      winnerBlock = `<div class="empty-state">No votes were cast this week.</div>`;
    } else if (winnerUids.length === 1){
      const wp = state.profiles[winnerUids[0]];
      winnerBlock = `
        <div class="winner-card burst">
          <div class="trophy-wrap">${ICON_TROPHY}</div>
          <p class="winner-name">${esc(wp ? wp.name : 'Unknown')}</p>
          <p class="winner-sub">Star Worker of the Week</p>
          <p class="winner-bonus">${ICON_WALLET} + B$${BONUS_AMOUNT} awarded</p>
        </div>`;
    } else {
      winnerBlock = `
        <div class="winner-card burst">
          <div class="trophy-wrap">${ICON_TROPHY}</div>
          <p class="winner-name">It's a tie</p>
          <p class="winner-sub">${winnerUids.map(u => esc(state.profiles[u] ? state.profiles[u].name : '?')).join(' · ')}</p>
        </div>
        ${admin ? `
          <div class="tie-list">
            ${winnerUids.map(uid => {
              const p = state.profiles[uid];
              const awarded = (state.settings.bonusAwardedUids||[]).includes(uid);
              return `<div class="tie-row">
                <span>${esc(p ? p.name : '?')}</span>
                <button class="small-btn" data-award="${uid}" ${awarded?'disabled':''}>${awarded ? 'Awarded' : `Award B$${BONUS_AMOUNT}`}</button>
              </div>`;
            }).join('')}
          </div>
        ` : ''}`;
    }

    // Only admins ever see the per-person breakdown — everyone else just sees the winner above.
    const scoreboardHTML = (admin && state.loadedTally) ? `
      <div class="scoreboard">
        ${Object.entries(state.profiles).map(([uid,p]) => {
          const count = state.tally[uid] || 0;
          const pct = total ? Math.round(count/total*100) : 0;
          return `<div class="score-row">
            <div class="score-top">
              <span class="sname">${esc(p.name)}</span>
              <span class="scount">${count} vote${count===1?'':'s'}</span>
            </div>
            <div class="score-track"><div class="score-fill" data-pct="${pct}"></div></div>
          </div>`;
        }).join('')}
      </div>
    ` : '';

    appEl.innerHTML = header(me) + `
      <p class="eyebrow">Results</p>
      <h1>${total} vote${total===1?'':'s'} cast this week</h1>
      ${winnerBlock}
      ${scoreboardHTML}
      ${admin ? `<button class="ghost-btn" id="newweek-btn">Start New Week</button>` : ''}
      ${financeAccess ? payoutQueueHTML() : ''}
      ${admin ? manageTeamHTML() : ''}
    `;

    document.getElementById('logout-btn').addEventListener('click', logout);
    const nw = document.getElementById('newweek-btn');
    if (nw) nw.addEventListener('click', () => { if (confirm("Clear this week's votes and start fresh?")) startNewWeek(); });
    appEl.querySelectorAll('[data-award]').forEach(btn => btn.addEventListener('click', () => awardBonus(btn.dataset.award)));
    if (financeAccess) bindPayoutQueue();
    if (admin) bindManageTeam();

    requestAnimationFrame(() => {
      appEl.querySelectorAll('.score-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; });
    });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
